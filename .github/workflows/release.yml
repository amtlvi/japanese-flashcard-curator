name: Build release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v0.1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Build every JLPT level
        run: >-
          python3 flashcard_curator.py all
          --level N5 --level N4 --level N3 --level N2 --level N1
      - name: Verify every JLPT level
        run: >-
          python3 flashcard_curator.py verify
          --level N5 --level N4 --level N3 --level N2 --level N1
      - name: Package canonical data
        run: >-
          python3 flashcard_curator.py package
          --level N5 --level N4 --level N3 --level N2 --level N1
      - name: Create release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" release-artifacts/* \
              --target "$GITHUB_SHA" \
              --title "JLPT N1–N5 Mochi decks $RELEASE_TAG" \
              --notes "Deterministic Mochi decks and canonical JSON/CSV data for JLPT N1–N5. See SOURCES.md for provenance and limitations."
          fi
