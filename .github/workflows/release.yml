name: Build release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: Select version
        run: echo "RELEASE_TAG=v$(uv version --short)" >> "$GITHUB_ENV"
      - run: uv run python -m unittest discover -s tests -v
      - name: Build, verify and package every level
        run: |
          levels="--level N5 --level N4 --level N3 --level N2 --level N1"
          uv run flashcard-curator all $levels
          uv run flashcard-curator verify $levels
          uv run flashcard-curator package $levels
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "Japanese JLPT flashcards for Anki and Mochi $RELEASE_TAG" \
              --notes-file README.md
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" release-artifacts/* \
              --target "$GITHUB_SHA" \
              --title "Japanese JLPT flashcards for Anki and Mochi $RELEASE_TAG" \
              --notes-file README.md
          fi
