[project]
name = "japanese-flashcard-curator"
version = "0.3.0"
description = "Reproducible JLPT flashcard curation with Anki and Mochi exports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
flashcard-curator = "japanese_flashcard_curator.cli:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.11.33"
